name: Build analytics-chatboat-be docker image

on:
  workflow_call:
    inputs:
      repository:
        description: "Working git repository"
        required: true
        type: string
      pwd:
        description: "Working directory"
        required: true
        type: string
      environment:
        description: "Deployment environment"
        required: true
        type: string
      account_id:
        description: "Environment Account ID"
        required: true
        type: string
      service_name:
        description: "Service name"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: true
        type: string
      ecr_image_name:
        description: "ECR image name"
        required: true
        type: string
      docker_file_name:
        description: "Docker file name"
        required: true
        type: string
    secrets:
      workflow_arn:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for the Docker image"
        default: "latest"
        required: true

permissions:
  id-token: write
  contents: read

env:
  ACCOUNTID: ${{ inputs.account_id }}
  SERVICE: ${{ inputs.service_name }}
  AWS_REGION: ${{ inputs.aws_region }}
  ECR_IMAGE_NAME: ${{ inputs.ecr_image_name }}
  DOCKER_FILE_NAME: ${{ inputs.docker_file_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set environment-specific variables
        run: |
          echo "BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Sanitize branch name
        run: |
          SANITIZED_BRANCH_NAME="${BRANCH_NAME//\//_}"
          echo "SANITIZED_BRANCH_NAME=$SANITIZED_BRANCH_NAME" >> $GITHUB_ENV

      - name: Create work-directory
        run: |
          echo "Creating Directory: ${{ inputs.pwd }}"
          sudo mkdir -p ${{ inputs.pwd }}
          sudo chmod -R 777 ${{ inputs.pwd }}
          sudo mkdir -p ${{ inputs.pwd }}/dist
          sudo chmod -R 777 ${{ inputs.pwd }}/dist

      - name: Download Build Number Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.pwd }}-${{ env.SANITIZED_BRANCH_NAME }}-build-number
          path: ${{ inputs.pwd }}

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.pwd }}-${{ env.SANITIZED_BRANCH_NAME }}-build
          path: ${{ inputs.pwd }}

      - name: Check contents of dist
        run: |
          du -sh dist || echo "dist is empty"
          mv dist/package.json ./
          mv dist/pnpm-lock.yaml ./
          mv dist/Dockerfile ./
          mv dist/public ./public
          mv dist/standalone ./standalone
          mv dist/static ./static
          rm -rf dist
          ls -al .
        working-directory: ${{ inputs.pwd }}
          
      - name: Set environment-specific variables
        run: |
          echo "VERSION=${{ github.event.inputs.version || 'latest' }}" >> $GITHUB_ENV
          BUILD_NUMBER=$(cat ${{ inputs.pwd }}_${{ env.SANITIZED_BRANCH_NAME }}_build_number.txt | awk -F'=' '{print $2}')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "BUILD_NUMBER: $BUILD_NUMBER"
        working-directory: ${{ inputs.pwd }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.workflow_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Install pack CLI
        run: |
          curl -sSL "https://github.com/buildpacks/pack/releases/download/v0.23.0/pack-v0.23.0-linux.tgz" | tar -xz -C /usr/local/bin
        working-directory: ${{ inputs.pwd }}

      - name: ECR login and pack build
        run: |
          echo "Authenticate with ECR"
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ACCOUNTID.dkr.ecr.$AWS_REGION.amazonaws.com
          echo "Building New ECR Image"
          docker build -f $DOCKER_FILE_NAME -t $SERVICE .
        working-directory: ${{ inputs.pwd }}

      - name: Docker run
        run: |
          docker run --name $SERVICE-test -p 8086:8080 -d $SERVICE
          sleep 30s
          docker ps -a
          BUILD_FLAG=$(docker ps -a --format "table {{.Status}}" -f name=$SERVICE-test | grep -v STATUS | cut -d ' ' -f1)
          echo "BUILD_FLAG=${BUILD_FLAG}" >> $GITHUB_ENV
        working-directory: ${{ inputs.pwd }}

      - name: Docker push to ECR
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          VERSION: ${{ env.VERSION }}
        run: |
          echo "Authenticate with ECR"
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ACCOUNTID.dkr.ecr.$AWS_REGION.amazonaws.com
          echo "Pushing New ECR Image"
          docker tag $SERVICE:latest $ACCOUNTID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_IMAGE_NAME:$BUILD_NUMBER          
          docker push $ACCOUNTID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_IMAGE_NAME:$BUILD_NUMBER
          docker tag $SERVICE:latest $ACCOUNTID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_IMAGE_NAME:latest
          docker push $ACCOUNTID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_IMAGE_NAME:latest
          docker tag $SERVICE:latest $ACCOUNTID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_IMAGE_NAME:$VERSION
          docker push $ACCOUNTID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_IMAGE_NAME:$VERSION
        working-directory: ${{ inputs.pwd }}
